name: Garmin sync

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 KST — 전체 사용자 증분 동기화
    - cron: "7 * * * *"     # 매시 — 방금 연결한 사용자의 첫 동기화만 (없으면 즉시 종료)
  workflow_dispatch:
    inputs:
      since:
        description: "YYYY-MM-DD 부터 다시 가져오기 (비우면 증분)"
        required: false
      new_only:
        description: "첫 동기화 전인 사용자만 (연결 직후 앱이 자동으로 호출)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: pip install -r sync/requirements.txt
      - name: Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync/sync.py ${{ inputs.since && format('--since {0}', inputs.since) || '' }} ${{ (github.event.schedule == '7 * * * *' || inputs.new_only) && '--new-only' || '' }}
